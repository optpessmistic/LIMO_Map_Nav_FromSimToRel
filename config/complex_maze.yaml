# Manual simulation profile for worlds/complex_maze.world.
# No target coordinates/count or ground-truth occupancy map is supplied to ROS.
# Pass fresh output_dir / retention_output_dir on each command line.
limo_maze_mission:
  ros__parameters:
    use_sim_time: true
    autonomous: true
    return_home: false
    tf_max_age_s: 1.5
    navigation_failure_cooldown_s: 1.0
    navigation_recovery_timeout_s: 3.0
    frontier_fallback_standoff_m: 0.8
    require_processed_inspection: true
    require_retained_inspection: true
    inspection_required_frames: 3
    # Includes settling, frame acquisition, writes and durable receipts (wall time).
    inspection_timeout_s: 90.0
    # Slow WSL delivery tolerance; ROS timestamp age remains at 0.3 seconds.
    inspection_odom_wall_max_age_s: 1.0
    retention_max_total_samples: 256
    retention_max_windows: 128
    # 256 * 34816 bytes/slot + 128 * 4096 bytes/window = 9 MiB.
    retention_max_metadata_bytes: 16777216
    post_mapping_observation_mode: bounded_processed_frames
    observation_max_stations: 6
    observation_headings_per_station: 4
    observation_max_dispatches: 24
    observation_stage_timeout_s: 720.0
    observation_relocation_radius_m: 0.15
    initial_clearance_radius_m: 0.30
    initial_clearance_source: complex_world_sha256_3c70f1decde85c5cdcf74fc2f0586a7051b83e4792322f7071a8b338e02089b5
    mission_timeout_s: 3600.0
    goal_timeout_s: 180.0
    return_timeout_s: 300.0

red_rgbd_sim_baseline:
  ros__parameters:
    use_sim_time: true
    enabled: true
    depth_registered_to_color: true
    publish_frame_processing: true
    retention_enabled: true
    # Wall-time budgets for slow WSL child startup/transfer; success returns early.
    # A request may wait behind the other two frames and a checkpoint writer.
    retention_worker_timeout_s: 15.0
    retention_request_timeout_s: 60.0
    retention_shutdown_timeout_s: 20.0
    retention_max_jobs: 256
    retention_max_requests: 256
    # 768 MiB raw file reservation cap; not continuous video recording.
    retention_max_file_bytes: 805306368
